version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
    assignees:
      - GavZheng
    labels:
      - dependencies

