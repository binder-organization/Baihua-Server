version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
