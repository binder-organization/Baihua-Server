services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20

  server:
    profiles:
      - container
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      BAIHUA_ENV: production
      BIND_HOST: 0.0.0.0
      BAIHUA_ENCRYPTED_GRACE_PERIOD_SECS: ${BAIHUA_ENCRYPTED_GRACE_PERIOD_SECS}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - target: 2424
        host_ip: 127.0.0.1
    depends_on:
      database:
        condition: service_healthy

volumes:
  data:
