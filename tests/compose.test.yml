services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20

  server:
    profiles:
      - container
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      BAIHUA_ENV: production
      BAIHUA_DIR: /app/.baihua
      BIND_HOST: 0.0.0.0
      BAIHUA_ENCRYPTED_GRACE_PERIOD_SECS: ${BAIHUA_ENCRYPTED_GRACE_PERIOD_SECS}
      BAIHUA_REQUEST_TIMEOUT_SECS: "2"
      BAIHUA_MAXIMUM_CONCURRENT_UPLOADS_PER_USER: "1"
      BAIHUA_FILE_UPLOAD_IDLE_TIMEOUT_SECS: "4"
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - target: 2424
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ${BAIHUA_TEST_FILES_DIRECTORY}
        target: /app/.baihua/files
    depends_on:
      database:
        condition: service_healthy

volumes:
  data:
