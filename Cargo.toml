[package]
name = "baihua-server"
version = "0.1.4"
edition = "2024"

[dependencies]
axum = {version = "0.8.8", features = ["macros", "ws", "multipart"]}
futures-util = "0.3"
rustyline = "17.0.2"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"
dirs = "6.0.0"
toml = "0.9.12"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
chrono = { version = "0.4.43", features = ["serde"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono"]}
dotenvy = "0.15.7"
uuid = { version = "1.21.0", features = [ "serde", "v7"] }
bcrypt = "0.18.0"
regex = "1.12.3"
lazy_static = "1.5.0"
base64 = "0.22"
sha2 = "0.10"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
