services:
  database:
    image: postgres:18
    container_name: baihua-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:2423:5432"
    volumes:
      - data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    profiles:
      - production
    build: .
    container_name: baihua-server
    ports:
      - "127.0.0.1:2424:2424"
    volumes:
      - avatars:/app/.baihua/avatars
    environment:
      BAIHUA_ENV: production
      BAIHUA_DIR: /app/.baihua
      BIND_HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    restart: always

  reverse-proxy:
    profiles:
      - public
    image: caddy:2.11.6
    ports:
      - "80:80"
      - "443:443"
    environment:
      BAIHUA_DOMAIN: ${BAIHUA_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
    name: baihua-postgres-data
  avatars:
    name: baihua-avatar-data
  caddy_data:
    name: baihua-caddy-data
  caddy_config:
    name: baihua-caddy-config
