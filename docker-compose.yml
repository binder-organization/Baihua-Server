services:
  database:
    image: postgres:18
    container_name: baihua-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:2423:5432"
    volumes:
      - data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    profiles:
      - production
    build: .
    container_name: baihua-server
    volumes:
      - avatars:/app/.baihua/avatars
      - files:/app/.baihua/files
    environment:
      BAIHUA_ENV: production
      BAIHUA_DIR: /app/.baihua
      BAIHUA_REQUIRE_ENCRYPTED_TRANSPORT: ${BAIHUA_REQUIRE_ENCRYPTED_TRANSPORT:-true}
      BAIHUA_DOMAIN: ${BAIHUA_DOMAIN}
      BAIHUA_MAIL_SENDER_ADDRESS: ${BAIHUA_MAIL_SENDER_ADDRESS:-}
      BAIHUA_MAIL_SENDER_NAME: ${BAIHUA_MAIL_SENDER_NAME:-}
      BAIHUA_MAIL_SERVER_ADDRESS: ${BAIHUA_MAIL_SERVER_ADDRESS:-}
      BAIHUA_MAIL_SERVER_PORT: ${BAIHUA_MAIL_SERVER_PORT:-}
      BAIHUA_MAIL_SECURITY: ${BAIHUA_MAIL_SECURITY:-}
      BAIHUA_MAIL_USERNAME: ${BAIHUA_MAIL_USERNAME:-}
      BAIHUA_MAIL_PASSWORD: ${BAIHUA_MAIL_PASSWORD:-}
      BAIHUA_MAIL_SUBJECT: ${BAIHUA_MAIL_SUBJECT:-}
      BAIHUA_MAIL_TEMPLATE_PATH: ${BAIHUA_MAIL_TEMPLATE_PATH:-}
      BAIHUA_MAIL_SENDS_PER_EMAIL_PER_MINUTE: ${BAIHUA_MAIL_SENDS_PER_EMAIL_PER_MINUTE:-}
      BAIHUA_EMAIL_TOKEN_LIFETIME_MINUTES: ${BAIHUA_EMAIL_TOKEN_LIFETIME_MINUTES:-}
      BIND_HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
      reverse-proxy:
        condition: service_started
    restart: always

  reverse-proxy:
    image: caddy:2.11.6
    ports:
      - "80:80"
      - "2424:2424"
    environment:
      BAIHUA_DOMAIN: ${BAIHUA_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  data:
    name: baihua-postgres-data
  avatars:
    name: baihua-avatar-data
  files:
    name: baihua-file-data
  caddy_data:
    name: baihua-caddy-data
  caddy_config:
    name: baihua-caddy-config
